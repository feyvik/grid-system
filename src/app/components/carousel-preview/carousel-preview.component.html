<div class="carousel-wrap"
     (mouseenter)="isHovered.set(true)"
     (mouseleave)="isHovered.set(false)">

  <!-- Large image area -->
  <div class="large-image-area"
       [style.height.px]="cfg.largeImageHeight">
    @if (largeImageSrc()) {
      <div class="large-img-container">
        <img [src]="largeImageSrc()!" alt="" class="large-img" />
      </div>
    } @else {
      <div class="large-img-placeholder">
        <span class="placeholder-icon">🖼</span>
        <span>No images yet — upload from the section editor</span>
      </div>
    }

    <!-- Arrows -->
    <button type="button" class="arrow arrow-left" (click)="previousImage()">‹</button>
    <button type="button" class="arrow arrow-right" (click)="nextImage()">›</button>
  </div>

  <!-- Thumbnail strip -->
  <div class="thumbnail-strip">
    @for (thumb of visibleThumbnails(); track thumb.idx) {
      <div class="thumbnail-slot"
           [style.width.px]="cfg.thumbnailWidth"
           [style.height.px]="cfg.thumbnailHeight"
           [class.thumb-active]="isThumbnailActive(thumb.idx)"
           (click)="setFocused(thumb.idx)">
        @if (thumb.image) {
          <img [src]="thumb.image.src" alt="" class="thumb-img" />
        } @else {
          <div class="thumb-placeholder">
            <span>🖼</span>
          </div>
        }
      </div>
    }
  </div>

  <!-- Editor mode hover overlay -->
  @if (!es.isPreviewMode() && isHovered()) {
    <div class="edit-overlay" (click)="onEditCarouselClick($event)">
      <span>✏ Edit Carousel</span>
    </div>
  }

</div>
