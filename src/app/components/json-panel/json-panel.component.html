<div class="json-panel">
  <div class="panel-header">
    <button type="button" class="toggle-btn" (click)="toggle()">
      { } JSON {{ isOpen() ? '▲' : '▼' }}
    </button>
    @if (isOpen()) {
      <button type="button" class="copy-btn" (click)="copy()">
        {{ copied() ? '✓ Copied' : 'Copy' }}
      </button>
      <button type="button" class="close-btn" (click)="toggle()">Close</button>
    }
  </div>
  @if (isOpen()) {
    <div class="json-body">
      <pre class="json-pre">{{ es.getPageJSON() }}</pre>
    </div>
  }
</div>
